services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: onehopz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onehopz_dev}
      POSTGRES_USER: ${POSTGRES_USER:-onehopz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onehopz_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onehopz_user} -d ${POSTGRES_DB:-onehopz_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - onehopz_network

  redis:
    image: redis:7-alpine
    container_name: onehopz_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - onehopz_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onehopz_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ONEHOPZ_ENV=${ONEHOPZ_ENV:-development}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-onehopz-dev-insecure-secret-key-replace-in-production-1234567890}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      - POSTGRES_DB=${POSTGRES_DB:-onehopz_dev}
      - POSTGRES_USER=${POSTGRES_USER:-onehopz_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-onehopz_dev_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - onehopz_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onehopz_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
    environment:
      - ONEHOPZ_ENV=${ONEHOPZ_ENV:-development}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-onehopz-dev-insecure-secret-key-replace-in-production-1234567890}
      - POSTGRES_DB=${POSTGRES_DB:-onehopz_dev}
      - POSTGRES_USER=${POSTGRES_USER:-onehopz_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-onehopz_dev_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - onehopz_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onehopz_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - ONEHOPZ_ENV=${ONEHOPZ_ENV:-development}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-onehopz-dev-insecure-secret-key-replace-in-production-1234567890}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - onehopz_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onehopz_frontend
    restart: unless-stopped
    command: npm run dev -- -H 0.0.0.0 -p 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-development}
    depends_on:
      backend:
        condition: service_started
    networks:
      - onehopz_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  onehopz_network:
    driver: bridge
